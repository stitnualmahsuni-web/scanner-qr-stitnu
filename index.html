<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Scanner QR Absensi - STITNU Al-Mahsuni</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#0f172a;color:#0f172a;min-height:100vh}.wrap{max-width:620px;margin:auto;padding:14px}.card{background:#fff;border-radius:22px;padding:18px;box-shadow:0 18px 50px rgba(0,0,0,.3)}h1{font-size:23px;margin:0 0 4px}.muted{color:#64748b;font-size:13px}.status{margin:14px 0;padding:12px;border-radius:12px;background:#f1f5f9;color:#334155;font-size:13px}.ok{background:#dcfce7;color:#166534}.err{background:#fee2e2;color:#991b1b}.btns{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.btn{border:0;border-radius:12px;padding:13px;font-weight:800;font-size:14px;cursor:pointer}.primary{background:#0f766e;color:#fff}.secondary{background:#e2e8f0;color:#0f172a}.danger{background:#fee2e2;color:#991b1b}#reader{width:100%;overflow:hidden;border-radius:16px;background:#020617;min-height:290px}#reader video{width:100%!important;border-radius:14px}@media(max-width:430px){.btns{grid-template-columns:1fr}.wrap{padding:9px}}
</style>
</head>
<body>
<div class="wrap"><div class="card">
  <h1>Scan QR Absensi Staff</h1>
  <div class="muted">STITNU Al-Mahsuni · kamera live HTTPS</div>
  <div id="status" class="status">Menyiapkan scanner...</div>
  <div id="reader"></div>
  <div class="btns">
    <button class="btn primary" onclick="start('environment')">Kamera Belakang</button>
    <button class="btn secondary" onclick="start('user')">Kamera Depan</button>
    <button class="btn danger" onclick="stop()">Hentikan</button>
    <button class="btn secondary" onclick="closeMe()">Kembali</button>
  </div>
</div></div>
<script>
const params=new URLSearchParams(location.search);
const nonce=params.get('nonce')||'';
let scanner=null, locked=false;
const statusEl=document.getElementById('status');
function status(msg,cls=''){statusEl.className='status '+cls;statusEl.textContent=msg}
async function stop(){if(scanner){try{await scanner.stop()}catch(e){}try{scanner.clear()}catch(e){}scanner=null}status('Kamera dihentikan. Tekan tombol kamera untuk mulai.')}
async function start(mode){
 await stop(); locked=false;
 if(!window.isSecureContext){status('Halaman scanner bukan HTTPS. Gunakan URL HTTPS.','err');return}
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){status('Browser tidak mendukung kamera. Gunakan Chrome/Edge/Safari terbaru.','err');return}
 status('Meminta izin kamera...');
 try{
   scanner=new Html5Qrcode('reader');
   await scanner.start({facingMode:{ideal:mode}},{fps:12,qrbox:(w,h)=>{const size=Math.max(180,Math.min(300,Math.floor(Math.min(w,h)*.72)));return {width:size,height:size}},aspectRatio:1},onScan,()=>{});
   status(mode==='user'?'Kamera depan aktif. Arahkan QR ke kotak.':'Kamera belakang aktif. Arahkan QR ke kotak.','ok');
 }catch(e){
   console.error(e);let m=String(e&&e.name?e.name:e);
   if(/NotAllowedError|PermissionDenied/i.test(m))m='Izin kamera ditolak. Izinkan kamera untuk situs scanner ini lalu coba lagi.';
   else if(/NotFoundError|DevicesNotFound/i.test(m))m='Kamera tidak ditemukan.';
   else if(/NotReadableError|TrackStartError/i.test(m))m='Kamera sedang dipakai aplikasi lain.';
   else if(/OverconstrainedError/i.test(m))m='Mode kamera tidak tersedia. Coba tombol kamera lainnya.';
   status(m,'err');await stop();
 }
}
async function onScan(decoded){
 if(locked)return;locked=true;const value=String(decoded||'').trim();if(!value){locked=false;return}
 await stop();status('QR terbaca. Mengirim ke aplikasi absensi...','ok');
 if(window.opener&&!window.opener.closed){window.opener.postMessage({type:'STITNU_QR_RESULT',value:value,nonce:nonce},'*');setTimeout(()=>window.close(),450)}else{status('Jendela aplikasi asal tidak ditemukan. Silakan tutup scanner dan buka dari aplikasi absensi.','err');locked=false}
}
function closeMe(){try{window.close()}catch(e){}setTimeout(()=>{if(!window.closed)location.href='about:blank'},100)}
window.addEventListener('beforeunload',()=>{if(scanner){try{scanner.stop()}catch(e){}}});
const initial=params.get('mode')||'environment';
status('Tekan Kamera Belakang untuk mulai.');
setTimeout(()=>start(initial),350);
</script>
</body></html>
